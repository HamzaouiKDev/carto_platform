global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'carto-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['carto-api:4000']
        labels:
          service: 'carto-api-gateway'
          environment: 'production'

  - job_name: 'redis'
    static_configs:
      - targets: ['carto-redis:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
