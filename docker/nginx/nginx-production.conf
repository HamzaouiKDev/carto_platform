# ==============================================================================
# CARTO PLATFORM ENTERPRISE — NGINX PRODUCTION REVERSE PROXY
# ==============================================================================

# Rate Limiting Zones (Allocated in Shared Memory)
limit_req_zone $binary_remote_addr zone=carto_api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=carto_tile_limit:20m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=carto_addr_limit:10m;

# Upstream Backend Pool with HTTP Persistent Keepalive
upstream carto_backend_cluster {
    server carto-api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── 1. HTTP Server (Redirect to HTTPS in Prod / Direct in Local) ──
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for GeoJSON, JS, CSS, SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/geo+json
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 256;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Rate Limiting Connection Caps
    limit_conn carto_addr_limit 50;

    # ── Proxy Cartographic Tiles with High Burst Capacity ──
    location ^~ /api/tiles/ {
        limit_req zone=carto_tile_limit burst=100 nodelay;

        proxy_pass http://carto_backend_cluster/api/tiles/;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for HTTP Keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tile response caching headers pass-through
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 15s;
    }

    # ── Proxy Core REST API Endpoints with Protection ──
    location ^~ /api/ {
        limit_req zone=carto_api_limit burst=30 nodelay;

        proxy_pass http://carto_backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Static Frontend Assets (HTML / CSS / JS / Assets) ──
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Single Page App Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to hidden/git files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
