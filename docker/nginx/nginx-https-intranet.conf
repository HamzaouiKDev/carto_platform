# ==============================================================================
#  CARTO PLATFORM ENTERPRISE — NGINX HTTPS INTRANET (Certificat Auto-signé)
#  Mode : HTTP:80 → redirect HTTPS:443 | HTTPS:443 → Frontend + API
#  Usage : docker/nginx/ssl/carto-selfsigned.{crt,key} requis
# ==============================================================================

# ── Rate Limiting ──
limit_req_zone  $binary_remote_addr zone=carto_api_limit:10m  rate=60r/s;
limit_req_zone  $binary_remote_addr zone=carto_tile_limit:20m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=carto_addr_limit:10m;

# ── Upstream API ──
upstream carto_backend_cluster {
    server carto-api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── 1. Serveur HTTP (Ports 80 & 8085) — Frontend Direct & API ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root              /usr/share/nginx/html;
    index             index.html;
    client_max_body_size 50M;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy direct pour les tuiles
    location ^~ /api/tiles/ {
        limit_req zone=carto_tile_limit burst=100 nodelay;

        proxy_pass         http://carto_backend_cluster/api/tiles/;
        proxy_http_version 1.1;
        proxy_set_header   Connection          "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_buffering    on;
        proxy_buffers      16 32k;
        proxy_read_timeout 15s;
    }

    # Proxy direct pour l'API REST
    location ^~ /api/ {
        limit_req zone=carto_api_limit burst=30 nodelay;

        proxy_pass         http://carto_backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Assets Statiques
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Le frontend web Studio SIG (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 2. HTTPS Principal ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── Certificat SSL Auto-signé ──
    ssl_certificate     /etc/nginx/ssl/carto-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/carto-selfsigned.key;

    # ── Paramètres TLS Sécurisés ──
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_dhparam               /etc/nginx/ssl/dhparam.pem;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Headers Sécurité HTTPS ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    # ── Général ──
    root              /usr/share/nginx/html;
    index             index.html;
    client_max_body_size 50M;
    limit_conn carto_addr_limit 50;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/geo+json image/svg+xml;
    gzip_min_length 256;

    # ── Proxy Tuiles Cartographiques ──────────────────────────────────────────
    location ^~ /api/tiles/ {
        limit_req zone=carto_tile_limit burst=100 nodelay;

        proxy_pass         http://carto_backend_cluster/api/tiles/;
        proxy_http_version 1.1;
        proxy_set_header   Connection          "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_buffering    on;
        proxy_buffers      16 32k;
        proxy_read_timeout 15s;
    }

    # ── Proxy API REST ────────────────────────────────────────────────────────
    location ^~ /api/ {
        limit_req zone=carto_api_limit burst=30 nodelay;

        proxy_pass         http://carto_backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Assets Statiques ─────────────────────────────────────────────────────
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquer les fichiers cachés
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }
}
