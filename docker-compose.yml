version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── 1. BASE DE DONNÉES SPATIALE POSTGRESQL + POSTGIS ──────────────────────
  carto-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: carto-postgis
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=64MB", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carto_db}
      POSTGRES_USER: ${POSTGRES_USER:-carto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carto_secure_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carto_postgis_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carto_user} -d ${POSTGRES_DB:-carto_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - carto-internal-net

  # ── 2. MOTEUR DE CACHE TUILES & RATE LIMITING REDIS ────────────────────────
  carto-redis:
    image: redis:7-alpine
    container_name: carto-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_pass}", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-1024mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--stop-writes-on-bgsave-error", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - carto_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks:
      - carto-internal-net

  # ── 3. PASSERELLE API GIS MULTI-FOURNISSEURS ──────────────────────────────
  carto-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carto-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-carto_user}:${POSTGRES_PASSWORD:-carto_secure_pass}@carto-postgis:5432/${POSTGRES_DB:-carto_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@carto-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_minimum_32_characters_long_99182}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_key_minimum_32_characters_88192}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ESRI_API_KEY: ${ESRI_API_KEY:-}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-CartoPlatform/1.0}
    depends_on:
      carto-postgis:
        condition: service_healthy
      carto-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - carto-internal-net
      - carto-public-net

  # ── 4. FRONTEND STUDIO CARTO & DASHBOARD NGINX ─────────────────────────────
  carto-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: carto-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
      - "80:80"
    depends_on:
      - carto-api
    logging: *default-logging
    networks:
      - carto-internal-net
      - carto-public-net

  # ── 5. MONITORING PROMETHEUS ───────────────────────────────────────────────
  carto-prometheus:
    image: prom/prometheus:v2.50.0
    container_name: carto-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - carto_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    logging: *default-logging
    networks:
      - carto-internal-net

  # ── 6. TABLEAUX DE BORD GRAFANA ────────────────────────────────────────────
  carto-grafana:
    image: grafana/grafana:10.3.3
    container_name: carto-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-GrafanaCarto2026!Pass}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - carto_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - carto-prometheus
    logging: *default-logging
    networks:
      - carto-internal-net

networks:
  carto-internal-net:
    driver: bridge
  carto-public-net:
    driver: bridge

volumes:
  carto_postgis_data:
  carto_redis_data:
  carto_prometheus_data:
  carto_grafana_data:
